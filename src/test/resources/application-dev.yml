temporal:
  worker:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:transac_aggr_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

logging:
  level:
    org.example.transacaggrapiapp: DEBUG

