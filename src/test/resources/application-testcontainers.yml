spring:
  datasource:
    url: will-be-overridden-by-service-connection
    username: will-be-overridden-by-service-connection
    password: will-be-overridden-by-service-connection
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.example.transacaggrapiapp: DEBUG
