name: CI – Build, Test & Push Docker Image

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/transac-aggr-api-app

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests (H2)
        run: ./mvnw test -Dspring.profiles.active=dev --batch-mode --no-transfer-progress

      - name: Run integration tests (Testcontainers + Postgres)
        run: ./mvnw test -Dtest=TransactionRepositoryTest --batch-mode --no-transfer-progress

      - name: Package JAR
        run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-jar
          path: target/transac-aggr-api-app-*.jar
          if-no-files-found: error

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR (skip tests – already passed)
        run: ./mvnw clean package -DskipTests --batch-mode --no-transfer-progress

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-gitops:
    name: Update GitOps image tag
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: JonathanManaka/Transaction-aggregate-api-gitops
          ref: main
          token: ${{ secrets.GITOPS_PAT }}      # see auth note below

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tag
        run: |
          cd k8s
          TAG="${GITHUB_SHA::7}"                 # 7-char short sha, matches your build tag
          kustomize edit set image \
            mphojmanaka/transac-aggr-api-app=mphojmanaka/transac-aggr-api-app:${TAG}

      - name: Commit, push branch & open PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          TAG="${GITHUB_SHA::7}"
          BRANCH="deploy/transac-agg-api-${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(dev): deploy transac-agg-api ${TAG}" \
            || { echo "no tag change, nothing to deploy"; exit 0; }
          git push -u origin "$BRANCH"
          gh pr create \
            --repo JonathanManaka/Transaction-aggregate-api-gitops \
            --base main \
            --head "$BRANCH" \
            --title "chore(dev): deploy transac-agg-api ${TAG}" \
            --body "Automated image bump to \`${TAG}\` from ${{ github.repository }}@${GITHUB_SHA}."